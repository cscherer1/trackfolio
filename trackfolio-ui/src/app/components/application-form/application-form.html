<section class="page">
  <div class="max-w-4xl mx-auto px-6 py-10 space-y-6">
    <div class="chrome card p-5 flex items-center justify-between">
      <h1 class="text-2xl font-semibold tracking-tight">
        <span class="bg-gradient-to-r from-indigo-600 to-fuchsia-600 bg-clip-text text-transparent">
          Add application
        </span>
      </h1>
      <a routerLink="/applications" class="btn">Back to list</a>
    </div>

    <div *ngIf="error" class="card p-4 border-rose-200 bg-rose-50 text-rose-700 dark:bg-rose-500/10 dark:text-rose-200 dark:border-rose-500/25">
      {{ error }}
    </div>

    <!-- FORM -->
    <form (ngSubmit)="submit()" [formGroup]="form" class="card p-6 space-y-6">

      <!-- Company -->
      <div>
        <label class="label">Company</label>
        <input type="text" formControlName="company" class="input w-full" />
      </div>

      <!-- Role -->
      <div>
        <label class="label">Role title</label>
        <input type="text" formControlName="roleTitle" class="input w-full" />
      </div>

      <!-- Source / Status / Date -->
      <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
        <!-- Source -->
        <div class="md:col-span-4">
          <label class="label">Source</label>
          <div class="select-wrap w-full">
            <select class="select w-full h-11" formControlName="source">
              <option *ngFor="let s of sources" [value]="s">{{ s }}</option>
            </select>
            <svg class="caret h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd"
                    d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.24a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.08z"
                    clip-rule="evenodd" />
            </svg>
          </div>
        </div>

        <!-- Status -->
        <div class="md:col-span-4">
          <label class="label">Status</label>
          <div class="select-wrap w-full">
            <select class="select w-full h-11" formControlName="status">
              <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
            </select>
            <svg class="caret h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd"
                    d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.24a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.08z"
                    clip-rule="evenodd" />
            </svg>
          </div>
        </div>

        <!-- Applied date -->
        <div class="md:col-span-4">
          <label class="label">Applied date</label>
          <input type="date" formControlName="appliedAt" class="input w-full h-11" />
        </div>
      </div>

      <!-- Location / Salary -->
      <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
        <div class="md:col-span-6">
          <label class="label">Location</label>
          <input type="text" formControlName="location" class="input w-full" />
        </div>
        <div class="md:col-span-6">
          <label class="label">Salary (text)</label>
          <input type="text" formControlName="salaryText" class="input w-full" />
        </div>
      </div>

      <!-- Job link -->
      <div>
        <label class="label">Job link</label>
        <input type="url" formControlName="jobLink" class="input w-full" />
      </div>

      <!-- Notes -->
      <div>
        <label class="label">Notes</label>
        <textarea formControlName="notes" rows="6" class="textarea w-full"></textarea>
      </div>

      <!-- Actions -->
      <div class="flex gap-3 justify-end">
        <button type="submit" [disabled]="saving" class="btn btn-primary">
          {{ saving ? 'Saving…' : 'Save' }}
        </button>
        <button type="button" (click)="form.reset()" class="btn">Reset</button>
      </div>
    </form>
  </div>
</section>
